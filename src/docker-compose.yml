version: '3.8'

services:
  # SQL Server - Configurado para 1432 interna e externamente
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: personal-ledger-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuaSenhaForte123!
      - MSSQL_PID=Developer
      - MSSQL_TCP_PORT=1432
    ports:
      - "1432:1432"
    volumes:
      - sql_data:/var/opt/mssql

  # Redis - Cache para a API Key do Pluggy
  redis:
    image: redis:latest
    container_name: personal-ledger-redis
    ports:
      - "6379:6379"
    restart: always

  # RabbitMQ - Mensageria com MassTransit
  rabbitmq:
    image: rabbitmq:3-management
    container_name: personal-ledger-rabbit
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

volumes:
  sql_data: